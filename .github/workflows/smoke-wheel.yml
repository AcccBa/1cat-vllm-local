name: smoke-wheel-build
on:
  workflow_dispatch:
env:
  TORCH_CUDA_ARCH_LIST: "7.0"
  CMAKE_CUDA_ARCHITECTURES: "70"
  MAX_JOBS: "8"
  CUDA_HOME: /usr/local/cuda-12.8
  PIP_CACHE_DIR: /mnt/pipcache
  TMPDIR: /mnt/tmp
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu128
jobs:
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: free disk + scratch on /mnt
        run: |
          set -euo pipefail
          sudo /usr/local/bin/containerimage 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL "$HOME/.cache/pip" || true
          sudo mkdir -p /mnt/pipcache /mnt/tmp /mnt/build && sudo chown -R "$(id -un)" /mnt/pipcache /mnt/tmp /mnt/build
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gate1 - CUDA 12.8 toolkit (<=10min)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          wget -qO /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-toolkit-12-8
          # drop non-build components (~3G): profilers, cross-arch targets, web UI
          sudo rm -rf /usr/local/cuda-12.8/nsight-compute /usr/local/cuda-12.8/nsight-systems \
            /usr/local/cuda-12.8/libnvvp /usr/local/cuda-12.8/extras/CUPTI/doc \
            /usr/local/cuda-12.8/targets/aarch64-* 2>/dev/null || true
          sudo apt-get clean; sudo rm -rf /var/lib/apt/lists/*
          echo "$CUDA_HOME/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$CUDA_HOME/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          "$CUDA_HOME/bin/nvcc" --version | grep release
          df -h / | tail -1
      - name: gate2 - python deps (<=20min)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements/build/cuda.txt -r requirements/cuda.txt
          # build env needs rust toolchain for setuptools-rust frontend checks
          python -c "import torch; assert torch.version.cuda.startswith('12.8'), torch.version.cuda; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
          python -c "import cmake, ninja, setuptools_scm, setuptools_rust, patchelf" 2>&1 | head -1 || true
          df -h / /mnt
      - name: gate3 - cmake configure only (<=15min)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export CUDA_HOME=/usr/local/cuda-12.8 TORCH_CUDA_ARCH_LIST=7.0
          python tools/generate_cmake_presets.py
          cmake --preset release 2>&1 | tail -n 30
          echo "== configure OK =="; df -h / | tail -1
      - name: disk attribution (pre-gate4)
        run: |
          sudo du -xh --max-depth=1 / 2>/dev/null | sort -h | tail -12
          du -sh "$PIP_CACHE_DIR" "$TMPDIR" 2>/dev/null
      - name: gate4 - compile + link (long)
        timeout-minutes: 320
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          rm -rf build dist; ln -sfn /mnt/build "$GITHUB_WORKSPACE/build"
          mkdir -p dist
          # stream to both log and step output; pipefail keeps pip's rc
          set -o pipefail
          timeout 300m python -m pip wheel . --no-deps --no-build-isolation -w dist/ -v 2>&1 | tee wheelbuild.log | grep --line-buffered -E "%\]|error|Error|FAILED|Killed|No space" | tail -n 400
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then echo "==== build FAILED rc=$rc, log tail ===="; tail -n 200 wheelbuild.log; exit "$rc"; fi
          ls -la dist/
      - name: gate5 - sanity check wheel
        run: |
          set -euo pipefail
          w=$(ls dist/*.whl)
          echo "wheel=$w sha256=$(sha256sum "$w" | cut -d' ' -f1)"
          python - "$w" <<'PY'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          need = ["vllm/_C.abi3.so", "vllm/_moe_C.abi3.so",
                  "flash_attn_v100/flash_attn_v100_cuda.cpython-312-x86_64-linux-gnu.so"]
          missing = [n for n in need if n not in names]
          print(f"files={len(names)} missing={missing}")
          assert not missing, f"missing native extensions: {missing}"
          PY
      - name: upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            wheelbuild.log
            cmake-build-release/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: smoke-wheel
          path: dist/*.whl
          retention-days: 30
