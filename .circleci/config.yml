version: 2.1

jobs:
  wheel:
    machine:
      image: ubuntu-2404:current
    resource_class: 2xlarge   # 16 vCPU / 64 GB / 150 GB
    environment:
      TORCH_CUDA_ARCH_LIST: "7.0"
      CMAKE_CUDA_ARCHITECTURES: "70"
      CUDA_HOME: /usr/local/cuda-12.8
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu128
    steps:
      - checkout
      - run:
          name: gates 1-3 (CUDA toolkit + python deps + cmake configure)
          command: |
            set -euo pipefail
            export MAX_JOBS=14 DEBIAN_FRONTEND=noninteractive
            df -h / | tail -1
            wget -qO /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
            sudo dpkg -i /tmp/cuda-keyring.deb
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cuda-toolkit-12-8 python3.12 python3.12-venv
            sudo rm -rf /usr/local/cuda-12.8/nsight-compute /usr/local/cuda-12.8/nsight-systems /usr/local/cuda-12.8/libnvvp || true
            sudo apt-get clean
            python3.12 -m venv venv
            ./venv/bin/pip install -U pip setuptools wheel
            ./venv/bin/pip install -r requirements/build/cuda.txt -r requirements/cuda.txt
            ./venv/bin/python -c "import torch; assert torch.version.cuda.startswith('12.8'); print('torch', torch.__version__)"
            ./venv/bin/python tools/generate_cmake_presets.py
            PATH="$CUDA_HOME/bin:$PATH" ./venv/bin/cmake --preset release 2>&1 | tail -n 20
            df -h / | tail -1
      - run:
          name: gate4 - full wheel build
          command: |
            set -euo pipefail
            export MAX_JOBS=14
            export PATH="$CUDA_HOME/bin:$PATH"
            mkdir -p dist
            ./venv/bin/pip wheel . --no-deps --no-build-isolation -w dist/ -v > wheelbuild.log 2>&1 &
            BPID=$!
            while kill -0 $BPID 2>/dev/null; do
              sleep 120
              df -h / | tail -1
              grep -E "^ *\[ *[0-9]+%\]" wheelbuild.log | tail -1 || true
            done
            wait $BPID || { echo "==== build FAILED ===="; tail -n 200 wheelbuild.log; exit 1; }
            tail -n 30 wheelbuild.log
            ls -la dist/
      - run:
          name: gate5 - sanity check
          command: |
            set -euo pipefail
            w=$(ls dist/*.whl)
            echo "wheel=$w sha256=$(sha256sum "$w" | cut -d' ' -f1)"
            python3.12 - "$w" <<'PY'
            import sys, zipfile
            names = set(zipfile.ZipFile(sys.argv[1]).namelist())
            need = ["vllm/_C.abi3.so", "vllm/_moe_C.abi3.so",
                    "flash_attn_v100/flash_attn_v100_cuda.cpython-312-x86_64-linux-gnu.so"]
            missing = [n for n in need if n not in names]
            print(f"files={len(names)} missing={missing}")
            assert not missing
            PY
      - store_artifacts:
          path: dist/
      - store_artifacts:
          path: wheelbuild.log

workflows:
  build-wheel:
    jobs:
      - wheel
